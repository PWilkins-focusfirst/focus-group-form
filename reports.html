<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusFirst — Profit &amp; Loss</title>
<style>
  :root { --brand:#2f6f4f; --brand-dark:#24583f; --ink:#1f2937; --muted:#6b7280; --line:#d9dee5; --bg:#eef1f4; --in:#1d7a4c; --out:#b4342b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif; background:var(--bg); color:var(--ink); }
  .topbar { background:linear-gradient(135deg,var(--brand),var(--brand-dark)); color:#fff; padding:16px 26px; }
  .topbar a.home { color:#fff; opacity:.85; text-decoration:none; font-size:.85em; }
  .topbar h1 { margin:6px 0 0; font-size:1.5em; }
  .topbar p { margin:4px 0 0; opacity:.9; font-size:.88em; }
  .wrap { max-width:900px; margin:0 auto; padding:22px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 6px 18px rgba(20,30,50,.06); margin-bottom:18px; overflow:hidden; }
  .card > h2 { margin:0; padding:13px 18px; font-size:1em; background:#f7f9fb; border-bottom:1px solid var(--line); }
  .card .body { padding:16px 18px; }
  label { display:block; font-size:.8em; font-weight:600; color:#374151; margin:0 0 5px; }
  input, select { width:100%; padding:9px 11px; font-size:14px; border:1.5px solid var(--line); border-radius:7px; background:#fff; font-family:inherit; }
  button { font-family:inherit; font-size:14px; font-weight:600; border:none; border-radius:8px; padding:9px 14px; cursor:pointer; }
  .btn-ghost { background:#eef2f7; color:#334155; } .btn-ghost:hover{ background:#e2e8f0; }
  .controls { display:grid; grid-template-columns:1.4fr 1fr 1fr auto; gap:12px; align-items:end; }
  @media(max-width:760px){ .controls{ grid-template-columns:1fr 1fr; } }
  .hint { font-size:.78em; color:var(--muted); }

  /* statement */
  .stmt { max-width:720px; margin:0 auto; }
  .stmt .head { text-align:center; margin-bottom:8px; }
  .stmt .head h3 { margin:0; font-size:1.3em; }
  .stmt .head .sub { color:var(--muted); font-size:.9em; margin-top:3px; }
  table.pl { width:100%; border-collapse:collapse; font-size:.95em; }
  table.pl td { padding:7px 10px; }
  table.pl tr.section td { background:#f4f7f5; font-weight:700; border-top:2px solid #cfd8d2; border-bottom:1px solid var(--line); text-transform:uppercase; font-size:.82em; letter-spacing:.5px; }
  table.pl tr.line td { border-bottom:1px solid #eef1f4; }
  table.pl td.amt { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.pl tr.total td { border-top:1.5px solid #333; font-weight:700; }
  table.pl tr.net td { border-top:2.5px double #333; font-weight:800; font-size:1.08em; }
  .pos { color:var(--in); } .neg { color:var(--out); }
  .cat { padding-left:24px; color:#374151; }
  .empty { color:var(--muted); text-align:center; padding:14px; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
  @media(max-width:600px){ .kpis{ grid-template-columns:1fr; } }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:0 6px 18px rgba(20,30,50,.06); }
  .kpi .l { font-size:.72em; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .kpi .v { font-size:1.5em; font-weight:700; margin-top:4px; }
  .note { font-size:.8em; color:var(--muted); margin-top:8px; }

  @media print {
    .topbar, .card.controls-card, .noprint { display:none !important; }
    body { background:#fff; }
    .card { box-shadow:none; border:none; }
  }
</style>
</head>
<body>
  <div class="topbar noprint">
    <a class="home" href="index.html">← FocusFirst home</a> &nbsp;·&nbsp; <a class="home" href="help.html">Help</a>
    <h1>Profit &amp; Loss</h1>
    <p>Income statement · transfers between your accounts are excluded</p>
  </div>

  <div class="wrap">
    <div class="card controls-card noprint">
      <h2>Report period</h2>
      <div class="body">
        <div class="controls">
          <div>
            <label>Quick range</label>
            <select id="range">
              <option value="this-month">This month</option>
              <option value="last-month">Last month</option>
              <option value="this-quarter">This quarter</option>
              <option value="this-year" selected>This year (YTD)</option>
              <option value="last-year">Last year</option>
              <option value="all">All time</option>
              <option value="custom">Custom…</option>
            </select>
          </div>
          <div><label>From</label><input type="date" id="from"></div>
          <div><label>To</label><input type="date" id="to"></div>
          <div style="display:flex; gap:8px">
            <button class="btn-ghost" id="csvBtn">Export CSV</button>
            <button class="btn-ghost" id="printBtn">Print</button>
          </div>
        </div>
      </div>
    </div>

    <div class="kpis noprint">
      <div class="kpi"><div class="l">Revenue</div><div class="v pos" id="kRev">$0.00</div></div>
      <div class="kpi"><div class="l">Expenses</div><div class="v neg" id="kExp">$0.00</div></div>
      <div class="kpi"><div class="l">Net profit</div><div class="v" id="kNet">$0.00</div></div>
    </div>

    <div class="card">
      <div class="body">
        <div class="stmt">
          <div class="head">
            <h3>FocusFirst</h3>
            <div class="sub">Profit &amp; Loss · <span id="periodLabel"></span></div>
          </div>
          <table class="pl" id="plTable"></table>
          <div id="plEmpty" class="empty" style="display:none">No transactions in this period yet. Import data or add transactions in the ledger.</div>
          <div class="note" id="xferNote"></div>
        </div>
      </div>
    </div>
  </div>

<script>
"use strict";
const $=(id)=>document.getElementById(id);
const LS_TX="ff_ledger_v1";
function loadTx(){ try{ return JSON.parse(localStorage.getItem(LS_TX))||[]; }catch(e){ return []; } }
function money(n){ return "$"+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function iso(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }

function computeRange(kind){
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth();
  const mk=(yy,mm,dd)=>iso(new Date(yy,mm,dd));
  switch(kind){
    case "this-month": return [mk(y,m,1), mk(y,m+1,0)];
    case "last-month": return [mk(y,m-1,1), mk(y,m,0)];
    case "this-quarter": { const q=Math.floor(m/3)*3; return [mk(y,q,1), mk(y,q+3,0)]; }
    case "this-year": return [mk(y,0,1), mk(y,11,31)];
    case "last-year": return [mk(y-1,0,1), mk(y-1,11,31)];
    case "all": return ["", ""];
    default: return null; // custom
  }
}
function fmtLabel(from,to){
  if(!from&&!to) return "All time";
  const f=from?from.split("-"):null, t=to?to.split("-"):null;
  const p=a=>a?`${a[1]}/${a[2]}/${a[0]}`:"…";
  return `${p(f)} – ${p(t)}`;
}

function render(){
  const kind=$("range").value;
  let from=$("from").value, to=$("to").value;
  if(kind!=="custom"){
    const r=computeRange(kind); from=r[0]; to=r[1];
    $("from").value=from; $("to").value=to;
  }
  $("periodLabel").textContent = fmtLabel(from,to);

  const tx=loadTx().filter(t=>{
    if(from && t.date<from) return false;
    if(to && t.date>to) return false;
    return true;
  });

  const inc={}, exp={}; let incTot=0, expTot=0, xferTot=0, xferCount=0;
  tx.forEach(t=>{
    const amt=parseFloat(t.amount)||0;
    if(t.type==="transfer"){ xferTot+=amt; xferCount++; return; }
    const cat=(t.category||"").trim() || "Uncategorized";
    if(t.type==="income"){ inc[cat]=(inc[cat]||0)+amt; incTot+=amt; }
    else if(t.type==="expense"){ exp[cat]=(exp[cat]||0)+amt; expTot+=amt; }
  });
  const net=incTot-expTot;

  $("kRev").textContent=money(incTot);
  $("kExp").textContent=money(expTot);
  $("kNet").textContent=money(net);
  $("kNet").className="v "+(net>=0?"pos":"neg");

  const rows=[];
  const sortedInc=Object.entries(inc).sort((a,b)=>b[1]-a[1]);
  const sortedExp=Object.entries(exp).sort((a,b)=>b[1]-a[1]);

  rows.push(`<tr class="section"><td>Revenue</td><td class="amt">&nbsp;</td></tr>`);
  if(sortedInc.length) sortedInc.forEach(([c,v])=>rows.push(`<tr class="line"><td class="cat">${esc(c)}</td><td class="amt">${money(v)}</td></tr>`));
  else rows.push(`<tr class="line"><td class="cat">—</td><td class="amt">$0.00</td></tr>`);
  rows.push(`<tr class="total"><td>Total revenue</td><td class="amt pos">${money(incTot)}</td></tr>`);

  rows.push(`<tr class="section"><td>Expenses</td><td class="amt">&nbsp;</td></tr>`);
  if(sortedExp.length) sortedExp.forEach(([c,v])=>rows.push(`<tr class="line"><td class="cat">${esc(c)}</td><td class="amt">${money(v)}</td></tr>`));
  else rows.push(`<tr class="line"><td class="cat">—</td><td class="amt">$0.00</td></tr>`);
  rows.push(`<tr class="total"><td>Total expenses</td><td class="amt neg">${money(expTot)}</td></tr>`);

  rows.push(`<tr class="net"><td>Net profit</td><td class="amt ${net>=0?'pos':'neg'}">${money(net)}</td></tr>`);

  $("plTable").innerHTML=rows.join("");
  $("plEmpty").style.display = tx.length ? "none" : "block";
  $("plTable").style.display = tx.length ? "" : "none";
  $("xferNote").textContent = xferCount ? `${xferCount} transfer(s) totaling ${money(xferTot)} were excluded from this statement (money moved between your accounts).` : "";

  // stash for CSV
  window._plData={from,to,sortedInc,sortedExp,incTot,expTot,net};
}
function exportCsv(){
  const d=window._plData; if(!d) return;
  const lines=[["FocusFirst Profit & Loss"],[fmtLabel(d.from,d.to)],[],["Revenue",""]];
  d.sortedInc.forEach(([c,v])=>lines.push([c,v.toFixed(2)]));
  lines.push(["Total revenue", d.incTot.toFixed(2)], [], ["Expenses",""]);
  d.sortedExp.forEach(([c,v])=>lines.push([c,v.toFixed(2)]));
  lines.push(["Total expenses", d.expTot.toFixed(2)], [], ["Net profit", d.net.toFixed(2)]);
  const csv=lines.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="focusfirst-pnl.csv"; a.click();
}
function init(){
  $("range").addEventListener("change", ()=>{ render(); });
  $("from").addEventListener("change", ()=>{ $("range").value="custom"; render(); });
  $("to").addEventListener("change", ()=>{ $("range").value="custom"; render(); });
  $("csvBtn").addEventListener("click", exportCsv);
  $("printBtn").addEventListener("click", ()=>window.print());
  render();
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
